<div class="grafica-container">

  <!-- Título -->
  <h3
    class="grafica-titulo"
    *ngIf="titulo">
    {{ titulo }}
  </h3>

  <!-- Gráfica circular -->
  <div
    class="grafica-circular-wrapper"
    [style.width.px]="tamano"
    [style.height.px]="tamano">

    <svg
      class="grafica-svg"
      viewBox="0 0 200 200"
      [attr.width]="tamano"
      [attr.height]="tamano">

      <!-- Círculo de fondo -->
      <circle
        cx="100"
        cy="100"
        r="90"
        fill="none"
        stroke="rgba(255, 255, 255, 0.05)"
        stroke-width="20">
      </circle>

      <!-- Segmentos -->
      <g
        *ngFor="let dato of datos; let i = index">

        <circle
          cx="100"
          cy="100"
          r="90"
          fill="none"
          [attr.stroke]="dato.color"
          stroke-width="20"
          [attr.stroke-dasharray]="
            calcularStrokeDasharray(dato.porcentaje)
          "
          [attr.transform]="
            calcularRotacion(i, datos)
          "
          class="segmento-circular"
          [style.filter]="
            'drop-shadow(0 0 8px ' +
            dato.color +
            '40)'
          ">
        </circle>

      </g>

      <!-- Centro -->
      <circle
        cx="100"
        cy="100"
        r="60"
        fill="#0a0e27">
      </circle>

      <!-- Total -->
      <text
        x="100"
        y="95"
        text-anchor="middle"
        fill="#ffffff"
        font-size="24"
        font-weight="bold">

        {{ calcularTotal() }}

      </text>

      <text
        x="100"
        y="115"
        text-anchor="middle"
        fill="#a0aec0"
        font-size="10">

        Total

      </text>

    </svg>

  </div>

  <!-- Leyenda -->
  <div
    class="leyenda-container"
    *ngIf="mostrarLeyenda">

    <div
      *ngFor="let dato of datos"
      class="leyenda-item">

      <div
        class="leyenda-color"
        [style.background-color]="dato.color">
      </div>

      <div class="leyenda-info">

        <span class="leyenda-etiqueta">
          {{ dato.etiqueta }}
        </span>

        <span class="leyenda-valor">
          {{ dato.valor }}
          ({{ dato.porcentaje | number:'1.0-0' }}%)
        </span>

      </div>

    </div>

  </div>

</div>
