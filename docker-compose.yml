version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: siged_db
    environment:
      POSTGRES_USER: ${DB_USER:-siged_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siged_password}
      POSTGRES_DB: ${DB_NAME:-siged_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - siged_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-siged_user} -d ${DB_NAME:-siged_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siged_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-siged_user}
      - DB_PASSWORD=${DB_PASSWORD:-siged_password}
      - DB_NAME=${DB_NAME:-siged_db}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=http://localhost:4200,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - siged_network
    restart: unless-stopped

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siged_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - siged_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  siged_network:
    driver: bridge